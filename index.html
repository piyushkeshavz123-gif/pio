
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pio — Personal AI</title>
<style>
body{margin:0;background:#f5f5f5;font-family:system-ui,-apple-system,sans-serif;height:100vh;display:flex;flex-direction:column}
header{padding:16px 22px;background:#111;color:white;font-size:20px;font-weight:700}
main{width:min(850px,94%);margin:auto;flex:1;display:flex;flex-direction:column;min-height:0}
#chat{flex:1;overflow:auto;padding:24px 0}
.msg{max-width:78%;padding:12px 15px;margin:10px 0;border-radius:16px;white-space:pre-wrap;line-height:1.45}
.user{margin-left:auto;background:#111;color:#fff}
.pio{background:white;border:1px solid #ddd}
form{display:flex;gap:10px;padding:14px 0}
textarea{flex:1;resize:none;border:1px solid #ccc;border-radius:14px;padding:12px;font:inherit}
button{border:0;border-radius:14px;background:#111;color:#fff;padding:0 20px;font-weight:700}
.small{color:#777;font-size:12px;text-align:center;padding-bottom:12px}
</style>
</head>
<body>
<header>Pio</header>
<main>
<div id="chat">
  <div class="msg pio">Hi. I'm Pio. What do you want to explore?</div>
</div>
<form id="form">
<textarea id="input" rows="2" placeholder="Message Pio..."></textarea>
<button>Send</button>
</form>
<div class="small">Pio — your personal AI chatbot</div>
</main>
<script>
const chat=document.getElementById("chat"), form=document.getElementById("form"), input=document.getElementById("input");
let messages=[];
function add(text, cls){const d=document.createElement("div");d.className="msg "+cls;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;}
form.onsubmit=async e=>{
 e.preventDefault(); const text=input.value.trim(); if(!text)return;
 input.value=""; add(text,"user"); messages.push({role:"user",content:text});
 const thinking=add("Thinking...","pio");
 try{
  const r=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages})});
  const data=await r.json(); thinking.textContent=data.reply||"I couldn't generate a response.";
  messages.push({role:"assistant",content:data.reply});
 }catch(err){thinking.textContent="Pio couldn't connect to the AI server."; }
};
</script>
</body>
</html>
